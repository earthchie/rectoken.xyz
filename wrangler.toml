name = "rectoken-xyz"
compatibility_date = "2026-11-16"
main = "src/worker.ts"

# Static site output. The Worker only handles /api/redeem and /check/*;
# everything else is served straight from dist with _headers and _redirects applied.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/check", "/check/*"]
